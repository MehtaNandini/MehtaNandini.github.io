<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="t"><title id="t">Human approval center</title><rect width="1440" height="900" fill="#f4f7fb"/><rect width="265" height="900" fill="#071426"/><text x="28" y="48" font-family="Arial" font-size="20" font-weight="700" fill="white">AI Delivery</text><rect x="14" y="360" width="236" height="46" rx="12" fill="white"/><text x="50" y="389" font-family="Arial" font-size="14" font-weight="700" fill="#071426">Approval center</text><text x="305" y="105" font-family="Arial" font-size="34" font-weight="700" fill="#071426">Human approval center</text><text x="305" y="138" font-family="Arial" font-size="15" fill="#64748b">Review evidence, evaluation results, and audit history before finalization.</text><rect x="305" y="170" width="1095" height="54" rx="16" fill="#fff7ed" stroke="#fed7aa"/><text x="330" y="203" font-family="Arial" font-size="13" fill="#9a3412">Demo identity notice: production deployment requires SSO, RBAC, and signed audit events.</text><rect x="305" y="255" width="420" height="560" rx="18" fill="white" stroke="#dbe4ee"/><rect x="330" y="285" width="370" height="145" rx="15" fill="#f8fafc" stroke="#168bd2" stroke-width="2"/><text x="350" y="322" font-family="Arial" font-size="14" font-weight="700" fill="#071426">Risk Assessment: AI delivery controls</text><text x="350" y="354" font-family="Arial" font-size="12" fill="#64748b">Evidence-backed findings and risk controls</text><rect x="350" y="382" width="115" height="27" rx="14" fill="#fef3c7"/><text x="368" y="400" font-family="Arial" font-size="10" font-weight="700" fill="#92400e">PENDING REVIEW</text><rect x="330" y="450" width="370" height="125" rx="15" fill="#f8fafc"/><text x="350" y="487" font-family="Arial" font-size="14" font-weight="700" fill="#071426">Executive Summary: AI governance</text><text x="350" y="520" font-family="Arial" font-size="12" fill="#64748b">Approved · Demo Reviewer</text><rect x="755" y="255" width="645" height="560" rx="18" fill="white" stroke="#dbe4ee"/><text x="785" y="295" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2" fill="#168bd2">REVIEW PACKET</text><text x="785" y="335" font-family="Arial" font-size="24" font-weight="700" fill="#071426">Risk Assessment: AI delivery controls</text><text x="785" y="380" font-family="Arial" font-size="14" fill="#475569">The report consolidates grounded findings and prepares them for</text><text x="785" y="405" font-family="Arial" font-size="14" fill="#475569">quality review, accountable ownership, and final approval.</text><rect x="785" y="440" width="585" height="120" rx="14" fill="#f8fafc"/><text x="810" y="475" font-family="Arial" font-size="14" font-weight="700" fill="#071426">Automated evaluation</text><text x="1300" y="475" font-family="Arial" font-size="24" font-weight="700" fill="#059669">100%</text><text x="810" y="515" font-family="Arial" font-size="12" fill="#475569">✓ structured output    ✓ citation integrity    ✓ latency threshold</text><text x="785" y="605" font-family="Arial" font-size="11" font-weight="700" fill="#64748b">REVIEWER COMMENTS</text><rect x="785" y="620" width="585" height="70" rx="12" fill="white" stroke="#cbd5e1"/><text x="805" y="660" font-family="Arial" font-size="13" fill="#64748b">Evidence and quality gates reviewed.</text><rect x="785" y="715" width="175" height="50" rx="12" fill="white" stroke="#fda4af"/><text x="842" y="746" font-family="Arial" font-size="13" font-weight="700" fill="#e11d48">Reject</text><rect x="975" y="715" width="180" height="50" rx="12" fill="white" stroke="#cbd5e1"/><text x="1015" y="746" font-family="Arial" font-size="13" font-weight="700" fill="#071426">Request changes</text><rect x="1170" y="715" width="200" height="50" rx="12" fill="#059669"/><text x="1237" y="746" font-family="Arial" font-size="13" font-weight="700" fill="white">Approve</text></svg>

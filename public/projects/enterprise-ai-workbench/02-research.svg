<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="t"><title id="t">Grounded AI research with evidence</title><rect width="1440" height="900" fill="#f4f7fb"/><rect width="265" height="900" fill="#071426"/><text x="28" y="48" font-family="Arial" font-size="20" font-weight="700" fill="white">AI Delivery</text><rect x="14" y="180" width="236" height="46" rx="12" fill="white"/><text x="50" y="209" font-family="Arial" font-size="14" font-weight="700" fill="#071426">Research assistant</text><rect x="265" width="1175" height="74" fill="white"/><text x="305" y="130" font-family="Arial" font-size="34" font-weight="700" fill="#071426">AI research assistant</text><text x="305" y="162" font-family="Arial" font-size="15" fill="#64748b">Grounded answers with validated citations and inspectable source excerpts.</text><rect x="305" y="205" width="1095" height="245" rx="18" fill="white" stroke="#dbe4ee"/><rect x="305" y="205" width="1095" height="78" rx="18" fill="#071426"/><text x="335" y="240" font-family="Arial" font-size="17" font-weight="700" fill="white">Grounded research session</text><text x="335" y="264" font-family="Arial" font-size="12" fill="#9aacc0">Temperature 0 · verified workspace citations · injection guardrail</text><text x="335" y="320" font-family="Arial" font-size="12" font-weight="700" fill="#64748b">RESEARCH QUESTION</text><rect x="335" y="340" width="1035" height="70" rx="12" fill="white" stroke="#cbd5e1"/><text x="355" y="380" font-family="Arial" font-size="15" fill="#172033">How should enterprise AI outputs be evaluated before delivery?</text><rect x="1160" y="420" width="210" height="50" rx="12" fill="#0b1f3a"/><text x="1195" y="451" font-family="Arial" font-size="14" font-weight="700" fill="white">Run grounded query</text><rect x="305" y="500" width="690" height="330" rx="18" fill="white" stroke="#dbe4ee"/><text x="335" y="543" font-family="Arial" font-size="18" font-weight="700" fill="#071426">Grounded answer</text><rect x="790" y="526" width="165" height="30" rx="15" fill="#ecfdf5"/><text x="814" y="546" font-family="Arial" font-size="11" font-weight="700" fill="#047857">EVIDENCE VERIFIED</text><text x="335" y="590" font-family="Arial" font-size="15" fill="#334155">The indexed evidence requires AI outputs to pass structured output</text><text x="335" y="620" font-family="Arial" font-size="15" fill="#334155">validation, citation integrity, retrieval relevance, unsupported-claim</text><text x="335" y="650" font-family="Arial" font-size="15" fill="#334155">checks, latency thresholds, and accountable human review. [1]</text><line x1="335" y1="705" x2="955" y2="705" stroke="#e2e8f0"/><text x="335" y="740" font-family="Arial" font-size="12" fill="#64748b">Workflow 28a16c09 · evaluation recorded · simulated response</text><text x="1025" y="530" font-family="Arial" font-size="18" font-weight="700" fill="#071426">Source evidence</text><rect x="1025" y="555" width="375" height="210" rx="18" fill="white" stroke="#dbe4ee"/><text x="1050" y="590" font-family="Arial" font-size="14" font-weight="700" fill="#071426">[1] enterprise-ai-delivery-standard.md</text><text x="1050" y="618" font-family="Arial" font-size="12" fill="#64748b">Page 1 · relevance 93%</text><text x="1050" y="660" font-family="Arial" font-size="13" fill="#475569">Only approved reports are finalized.</text><text x="1050" y="685" font-family="Arial" font-size="13" fill="#475569">Quality evaluation includes citation</text><text x="1050" y="710" font-family="Arial" font-size="13" fill="#475569">integrity and workflow success.</text></svg>

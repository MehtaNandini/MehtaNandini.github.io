services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energyml
      POSTGRES_USER: energyml
      POSTGRES_PASSWORD: energyml_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energyml -d energyml"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  energyml:
    build: .
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://energyml:energyml_local_only@postgres:5432/energyml
      ARTIFACT_DIR: /data/artifacts
      DATASET_DIR: /data/datasets
      DEFAULT_RANDOM_SEED: 42
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - artifact_data:/data/artifacts
      - dataset_data:/data/datasets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  artifact_data:
  dataset_data:
